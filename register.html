<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CrowdHive</title>
    <link rel="icon" type="image/x-icon" href="Images/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <!-- Registration Form -->
    <div class="container register-container my-5">
        <div class="card p-4">
            <h3 class="text-center mb-4">Register</h3>
            <form id="registerForm">
                <div class="mb-3">
                    <label for="firstname" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstname">
                    <span id="firstnameError" class="text-danger"></span> <!-- Error message -->
                </div>
                <div class="mb-3">
                    <label for="lastname" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastname">
                    <span id="lastnameError" class="text-danger"></span> <!-- Error message -->
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email">
                    <span id="emailError" class="text-danger"></span> <!-- Error message -->
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password">
                    <span id="passwordError" class="text-danger"></span> <!-- Error message -->
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword">
                    <span id="confirmPasswordError" class="text-danger"></span> <!-- Error message -->
                </div>
                <div class="mb-3">
                    <label for="cardNumber" class="form-label">Card Number</label>
                    <input type="text" class="form-control" id="cardNumber">
                    <span id="cardNumberError" class="text-danger"></span> <!-- Error message -->
                </div>
                <button type="submit" class="btn btn-primary w-100" id="registerButton" disabled>Register</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="validations.js"></script>
</body>

</html>
